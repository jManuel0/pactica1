<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juan Manuel - Perfil</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="bg-light">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-sm">
          <div class="card-body text-center">

            <!-- Foto / Avatar -->
            <img src="../assets/images/portafolio1.jpg"
                 alt="Foto de Juan Manuel"
                 class="rounded-circle mb-3"
                 style="width: 150px; height: 150px; object-fit: cover;">

            <!-- Nombre completo -->
            <h3 class="card-title mb-1">Juan Manuel</h3>

            <!-- Programa o profesión -->
            <p class="text-muted mb-3">Ingeniería de Sistemas</p>

            <!-- Descripción breve -->
            <p class="card-text">
              Estudiante apasionado por el desarrollo web y las buenas prácticas
              de trabajo en equipo. Actualmente aprendiendo Git y control de versiones
              colaborativo.
            </p>

            <!-- Intereses / Habilidades -->
            <div class="mb-3">
              <span class="badge bg-primary me-1">HTML</span>
              <span class="badge bg-primary me-1">CSS</span>
              <span class="badge bg-primary me-1">Bootstrap</span>
              <span class="badge bg-secondary me-1">Git</span>
              <span class="badge bg-secondary me-1">Trabajo en equipo</span>
            </div>

            <!-- Enlaces a redes/plataformas -->
            <div class="d-flex justify-content-center gap-3 mb-4">
              <a href="https://github.com/jManuel0" target="_blank" class="text-dark">
                <i class="bi bi-github fs-4"></i>
              </a>
              <a href="https://linkedin.com/in/tu-usuario" target="_blank" class="text-primary">
                <i class="bi bi-linkedin fs-4"></i>
              </a>
            </div>

            <!-- Botón para regresar -->
            <a href="../index.html" class="btn btn-outline-secondary">
              <i class="bi bi-arrow-left"></i> Volver al inicio
            </a>

          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</html>
